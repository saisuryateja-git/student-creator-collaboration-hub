<!DOCTYPE html>
<html>
<head>
    <title>CreatorHub - Create</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>CreatorHub</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="discover.html">Discover</a>
        <a href="create.html">Create</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<section class="page">

    <h2>Create a Collaboration</h2>

    <p>
        Create a new opportunity and find students who
        are interested in collaborating with you.
    </p>

    <form>

        <label>Collaboration Title</label>
        <input type="text" placeholder="Enter collaboration title">

        <label>Category</label>
        <select>
            <option>Select Category</option>
            <option>Video</option>
            <option>Podcast</option>
            <option>Photography</option>
            <option>Design</option>
            <option>Music</option>
        </select>

        <label>Role Required</label>
        <input type="text" placeholder="Example: Video Editor">

        <label>Description</label>
        <textarea placeholder="Describe your collaboration"></textarea>

        <button type="submit">Create Collaboration</button>

    </form>

</section>

<footer>
    <p>CreatorHub - Student Creator Collaboration Hub</p>
</footer>

</body>
</html>
