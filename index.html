<!DOCTYPE html>
<html>
<head>
    <title>CreatorHub - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>CreatorHub</h1>
</header>

<section class="login-box">

    <h2>Welcome to CreatorHub</h2>

    <p>
        Login to create collaborations, apply for projects
        and connect with other students.
    </p>

    <form action="home.html">

        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>

    </form>

    <p>OR</p>

    <a href="home.html" class="continue-link">
        Continue without Login
    </a>

</section>

<footer>
    <p>CreatorHub - Student Creator Collaboration Hub</p>
</footer>

</body>
</html>
